version: '3.8'

services:
  # 1. Base de datos (MySQL)
  db:
    image: mysql:8.0
    container_name: mysql-database
    environment:
      MYSQL_DATABASE: petshop_db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Backend (Spring Boot)
  backend:
    build: 
      context: ./backend
    container_name: api-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      # Configuraciones inyectadas hacia Spring Boot
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/petshop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect

  # 3. Frontend (Angular)
  frontend:
    build: 
      context: ./frontend
    container_name: web-frontend
    ports:
      - "4200:80"  # Tu frontend en localhost:4200
    depends_on:
      - backend

volumes:
  # Volumen para que la BD no pierda datos si se apaga el contenedor
  db_data: